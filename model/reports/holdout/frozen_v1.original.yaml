      \ 19.5\n    duration_days: 9\n    rise_hours: 2\n    decay_hours: 24\n  S4:\n\
      \    sleep_hours_range:\n    - 5.0\n    - 5.4\n  N1:\n    rhr_delta_bpm_range:\n\
